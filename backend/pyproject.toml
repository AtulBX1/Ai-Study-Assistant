[project]
name = "ai-study-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Study Assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=23.1,<26",
    "boto3>=1.37,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "nltk>=3.9,<4",
    "PyJWT>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pdfplumber>=0.11,<1",
    "pymupdf>=1.25,<2",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.13,<2",
    "redis>=5,<7",
    "rake-nltk>=1.0,<2",
    "scikit-learn>=1.6,<2",
    "spacy>=3.8,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
    "yake>=0.6,<1",
]

[dependency-groups]
dev = [
    "black>=25.1,<26",
    "httpx>=0.28,<1",
    "mlflow-skinny>=2.17,<4",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
